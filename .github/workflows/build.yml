name: ArtisanKRNL Action Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [r8s]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            bc bison build-essential flex git libssl-dev libncurses-dev \
            curl zip python3-minimal toolchain-prefix-aarch64-linux-gnu \
            libarchive-tools xxd patchelf

      - name: Free Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc
          sudo apt clean

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanKRNL-${{ matrix.target }}
          path: build/out/${{ matrix.target }}/*.zip
