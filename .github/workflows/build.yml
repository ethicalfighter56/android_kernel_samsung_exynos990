name: Build ArtisanKRNL (Clang-16)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [r8s]

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y bc bison build-essential ccache curl flex git libelf-dev \
            libncurses-dev libssl-dev make python3 python3-pip p7zip-full xxd zip

      - name: Setup Clang 16 (r547379)
        run: |
          mkdir -p toolchain/clang_16
          cd toolchain/clang_16
          echo "Downloading Clang 16..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz
          rm clang.tar.gz
          echo "Clang 16 setup completed"
          ls -la bin/ | head -n 10

      - name: Make build.sh Executable
        run: chmod +x build.sh

      - name: Build Kernel for ${{ matrix.target }}
        run: |
          ./build.sh --model ${{ matrix.target }} --ksu y --recovery n

      - name: Upload Kernel ZIP (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: ArtisanKRNL-${{ matrix.target }}
          path: out/${{ matrix.target }}/*.zip
          retention-days: 7

      - name: Show Build Summary
        run: |
          echo "✅ Build completed for ${{ matrix.target }}"
          ls -lh out/${{ matrix.target }}/*.zip
